<script>
(function(){
  window.__ntpcStarted = false;
  window.addEventListener("error", function(e){
    if(window.__ntpcStarted) return;
    var app=document.getElementById("app");
    if(app){
      var msg=(e.error && e.error.stack) || e.message || "Unknown startup error";
      app.innerHTML='<div class="fatal"><h1>NTPC Digital Logbook</h1><p>The application could not start.</p><pre>'+String(msg).replace(/</g,"&lt;")+'</pre><p>The project has been protected against older saved demo data. Refresh the page once if needed.</p></div>';
    }
  });
})();
</script>

const NTPCStore = (() => {
  const memory = {};
  let ls = null;
  try {
    if (window.localStorage) {
      const testKey = "__ntpc_test__";
      window.localStorage.setItem(testKey, "1");
      window.localStorage.removeItem(testKey);
      ls = window.localStorage;
    }
  } catch (e) {}
  return {
    get(key) {
      try { return ls ? ls.getItem(key) : (memory[key] ?? null); }
      catch (e) { return memory[key] ?? null; }
    },
    set(key, value) {
      memory[key] = String(value);
      try { if (ls) ls.setItem(key, String(value)); } catch (e) {}
    },
    remove(key) {
      delete memory[key];
      try { if (ls) ls.removeItem(key); } catch (e) {}
    }
  };
})();

// to every unit so the engineer can configure the exact unit equipment later.
const baseCatalog=catalog.map(e=>({...e}));
const bfpBTemplate=baseCatalog.find(e=>e.id==="bfp-b");
if(bfpBTemplate) baseCatalog.push({...bfpBTemplate,id:"bfp-c",name:"Boiler Feed Pump C",params:bfpBTemplate.params.map(p=>[...p])});
catalog.length=0;
["Unit 1","Unit 2","Unit 3"].forEach(unit=>{
  baseCatalog.forEach(e=>{
    const id=e.id+"-"+unit.replace("Unit ","u");
    if(!catalog.some(x=>x.id===id)) catalog.push({...e,id,unit,params:e.params.map(p=>[...p])});
  });
});

function getDB(){
 let d=null;
 try { d=JSON.parse(NTPCStore.get(DB)||"null"); } catch(e) { d=null; }
 if(d && !Array.isArray(d.records)) d.records=[];
 if(d && !Array.isArray(d.catalog)) d.catalog=catalog.map(x=>({...x,params:x.params.map(p=>[...p])}));
 if(d)return d;
 d={records:[],catalog:catalog};
 const demo=[
 ["22 Sep","C","bfp-a","Main Pump Bearing DE",64],
 ["23 Sep","A","bfp-a","Main Pump Bearing DE",72],
 ["23 Sep","B","bfp-a","Main Pump Bearing DE",78],
 ["23 Sep","C","bfp-a","Main Pump Bearing DE",82],
 ["24 Sep","A","bfp-a","Main Pump Bearing DE",86],
 ["24 Sep","C","bfp-a","Main Pump Bearing DE",92],
 ["24 Sep","C","aph-a","Oil Flow",25],
 ["24 Sep","C","idfan-a","Fan Bearing Temperature DE",62]
 ];
 demo.forEach((x,i)=>d.records.push({id:"demo"+i,date:x[0],shift:x[1],equipmentId:x[2],parameter:x[3],value:x[4],status:"In Service",operator:"Demo Operator"}));
 NTPCStore.set(DB,JSON.stringify(d));return d;
}
function saveDB(d){NTPCStore.set(DB,JSON.stringify(d))}
function currentUser(){
 try{return JSON.parse(NTPCStore.get("ntpc_user")||"null")}
 catch(e){return null}
}


function shiftLabel(s){
 if(s==="A") return "A (07:00–14:00)";
 if(s==="B") return "B (14:00–22:00)";
 if(s==="C") return "C (22:00–07:00)";
 return s||"";
}

function checkVal(i){

 if(i.dataset.type==="text"){s.textContent=i.value?"Recorded":"Pending";s.className="pill "+(i.value?"green":"")+" state";return}
 const v=Number(i.value);if(i.value!==""&&(v<i.dataset.min||v>i.dataset.max)){s.textContent="HIGH";s.className="pill red state"}else{s.textContent="Normal";s.className="pill green state"}
}
function meta(id){
 const c=getCatalog();
 let e=c.find(x=>x.id===id);
 if(e)return e;
 // Compatibility with demo/older records whose equipment IDs did not yet
 // contain the unit suffix (for example "bfp-a" or "aph-a").
 const base=String(id||"");
 e=c.find(x=>x.id===base+"-u1") || c.find(x=>x.id===base+"-u2") || c.find(x=>x.id===base+"-u3");
 return e;
}
function isBad(r){const e=meta(r.equipmentId),p=e?.params.find(x=>x[0]===r.parameter);return p&&p[4]!=="text"?Number(r.value)<p[2]||Number(r.value)>p[3]:false}

 if(!data.length){ulatest.textContent="No data";uhist.innerHTML='<tr><td colspan="4" class="empty">No saved readings.</td></tr>';return}
